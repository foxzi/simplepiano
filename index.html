<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Пианино — учебная тетрадь: теория, гамма до мажор, MIDI и метроном в браузере.">
<title>Пианино — учебная тетрадь</title>
<link rel="icon" href="data:,">
<script>
  // Применяем сохранённую тему до отрисовки, чтобы избежать мигания.
  (function () {
    try {
      var THEMES = ["light", "dark", "notebook"];
      var stored = window.localStorage.getItem("pianoL.theme.v1");
      var theme = THEMES.indexOf(stored) !== -1 ? stored : null;
      if (!theme) {
        var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        theme = prefersDark ? "dark" : "notebook";
      }
      document.documentElement.setAttribute("data-theme", theme);
    } catch (err) {
      document.documentElement.setAttribute("data-theme", "notebook");
    }
  })();
</script>
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
